# Local Jira Software + Confluence Data Center for developing/testing the sdlc-work Atlassian bridge.
# Non-production only: runs on the company's Data Center developer license.
# Configure via .env (copy .env.example). Manage with ./dc.ps1.
name: sdlc-atlassian

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ATL_DB_PASSWORD: ${ATL_DB_PASSWORD:?set ATL_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  jira:
    image: atlassian/jira-software:${JIRA_VERSION:-10.3.25}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: ${ATL_DB_PASSWORD}
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      JVM_MINIMUM_MEMORY: ${JIRA_HEAP_MIN:-1024m}
      JVM_MAXIMUM_MEMORY: ${JIRA_HEAP_MAX:-3072m}
    volumes:
      - jiradata:/var/atlassian/application-data/jira
    ports:
      - "127.0.0.1:${JIRA_PORT:-8080}:8080"

  confluence:
    image: atlassian/confluence:${CONFLUENCE_VERSION:-10.2.18}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/confluence
      ATL_JDBC_USER: confluence
      ATL_JDBC_PASSWORD: ${ATL_DB_PASSWORD}
      ATL_DB_TYPE: postgresql
      # Optional; if empty, paste the license in the setup wizard instead.
      ATL_LICENSE_KEY: ${CONFLUENCE_LICENSE_KEY:-}
      JVM_MINIMUM_MEMORY: ${CONFLUENCE_HEAP_MIN:-1024m}
      JVM_MAXIMUM_MEMORY: ${CONFLUENCE_HEAP_MAX:-3072m}
    volumes:
      - confluencedata:/var/atlassian/application-data/confluence
    ports:
      - "127.0.0.1:${CONFLUENCE_PORT:-8090}:8090"
      - "127.0.0.1:${SYNCHRONY_PORT:-8091}:8091"

  # Bitbucket DC sets itself up unattended from SETUP_* (Spring Boot maps them to setup.* properties), so it
  # needs no wizard. dc.ps1 fills the license and admin password before first start. Search is off (no OpenSearch).
  bitbucket:
    image: atlassian/bitbucket:${BITBUCKET_VERSION:-9.4.24}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JDBC_DRIVER: org.postgresql.Driver
      JDBC_URL: jdbc:postgresql://postgres:5432/bitbucket
      JDBC_USER: bitbucket
      JDBC_PASSWORD: ${ATL_DB_PASSWORD}
      SEARCH_ENABLED: "false"
      SETUP_DISPLAYNAME: SDLC Bitbucket
      SETUP_BASEURL: http://bitbucket.localhost:${BITBUCKET_PORT:-7990}
      SETUP_LICENSE: ${BITBUCKET_LICENSE_KEY:-}
      SETUP_SYSADMIN_USERNAME: ${BITBUCKET_ADMIN_USER:-admin}
      SETUP_SYSADMIN_PASSWORD: ${BITBUCKET_ADMIN_PASSWORD:-}
      SETUP_SYSADMIN_DISPLAYNAME: Local Admin
      SETUP_SYSADMIN_EMAILADDRESS: admin@example.com
      JVM_MINIMUM_MEMORY: ${BITBUCKET_HEAP_MIN:-512m}
      JVM_MAXIMUM_MEMORY: ${BITBUCKET_HEAP_MAX:-2048m}
    volumes:
      - bitbucketdata:/var/atlassian/application-data/bitbucket
    ports:
      - "127.0.0.1:${BITBUCKET_PORT:-7990}:7990"
      - "127.0.0.1:${BITBUCKET_SSH_PORT:-7999}:7999"

  # Jenkins for the headless "work this ticket" loop (W-4): polls Jira and runs `sdlc-atl work --poll` in a fresh
  # clone. Configured as code (jenkins/casc), no wizard. The sdlc-work repo is mounted read-only for the CLI, the
  # skills and the pipeline. The apps are reached by the same *.localhost URLs as on the host: *.localhost always
  # means loopback (curl/git hard-code it), so the container forwards its own loopback ports to the app containers
  # (SDLC_LOCAL_FORWARDS, socat) and Jenkins itself listens on 8081, leaving 8080 for Jira.
  jenkins:
    build: ./jenkins
    image: sdlc-jenkins:local
    restart: unless-stopped
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
      JENKINS_OPTS: --httpPort=8081
      SDLC_LOCAL_FORWARDS: "${JIRA_PORT:-8080}:jira:8080 ${CONFLUENCE_PORT:-8090}:confluence:8090 ${BITBUCKET_PORT:-7990}:bitbucket:7990"
      SDLC_JENKINS_URL: http://localhost:${JENKINS_PORT:-8081}/
      SDLC_ATL: /opt/sdlc-work/plugins/sdlc/bin/sdlc-atl.mjs
      SDLC_WORK_REPO_URL: ${SDLC_WORK_REPO_URL:-http://bitbucket.localhost:7990/scm/sdlc/sandbox.git}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-http://jira.localhost:8080}
      JIRA_PAT: ${JIRA_PAT:-}
      CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-http://confluence.localhost:8090}
      CONFLUENCE_PAT: ${CONFLUENCE_PAT:-}
      BITBUCKET_BASE_URL: ${BITBUCKET_BASE_URL:-http://bitbucket.localhost:7990}
      BITBUCKET_TOKEN: ${BITBUCKET_TOKEN:-}
      # Dev: filled from `gh auth token` by dc.ps1. A real deployment uses a bot account's token with Copilot access.
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
    volumes:
      - jenkinsdata:/var/jenkins_home
      - ./jenkins/casc:/casc:ro
      - ../..:/opt/sdlc-work:ro
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8081}:8081"

volumes:
  pgdata:
  jiradata:
  confluencedata:
  bitbucketdata:
  jenkinsdata:
